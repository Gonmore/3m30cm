<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3m30cm Atleta</title>
    <meta name="description" content="Panel de atleta para el programa 3m30cm." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f59e0b" />
    <script>
      // Apply the saved theme before first paint to avoid a flash (default: dark).
      try {
        var t = localStorage.getItem("jump-athlete-theme");
        if (t !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
